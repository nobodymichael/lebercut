<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2f5f9"><title>LEBERCUT — rozkrój płyt</title><link rel="stylesheet" href="assets/style.css?v=carbon1"><link rel="stylesheet" href="assets/carbon-intro.css?v=1"><script defer src="assets/carbon-intro.js?v=1"></script></head><body data-intro="leber"><header class="top"><a href="./" class="brand"><img src="assets/logo.png" alt="LEBERCUT"></a><nav><a class="hub-link" href="/">← NOBODY</a><button id="nav-layout" class="nav active">Rozkrój płyt</button><button id="nav-equal" class="nav">Równe kawałki</button></nav><div class="actions"><button id="theme" title="Zmień motyw">◐</button><button id="new">Nowy projekt</button><button id="export">Eksport</button><label class="button">Import<input id="import" type="file" accept=".json,application/json" hidden></label><button class="primary" id="print">Drukuj</button></div></header><main><section id="layout"><div class="project"><input id="project" aria-label="Nazwa projektu" placeholder="Nazwa zamówienia (opcjonalnie)"><span id="saved">Zapis lokalny</span></div><div id="tabs" class="tabs"></div><div class="workspace"><section class="panel entry"><div id="settings"></div><div class="sectionhead"><h2>Formatki</h2><span id="count"></span></div><div id="editor"></div><div class="sectionhead listhead"><h2>Dodane elementy</h2><button id="undo" title="Cofnij">↶</button><button id="redo" title="Ponów">↷</button></div><div id="rows"></div></section><section class="panel result"><div class="sectionhead"><h2>Plan rozkroju</h2><button id="fullscreen">Pełny ekran</button></div><label class="cut-toggle"><input type="checkbox" id="show-cuts"> Pokaż kolejność cięć</label><div id="stats" class="stats"></div><div id="warning" role="status"></div><div id="boards"></div><div class="legend"><span><i class="swatch part"></i> Formatka</span><span><i class="swatch waste"></i> Odpad</span></div>

<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0d0e"><title>LEBERCUT — Rozkrój płyt</title><link rel="icon" href="assets/leber-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css?v=carbon03"><link rel="manifest" href="manifest.webmanifest?v=03"><link rel="apple-touch-icon" href="assets/lebercut-app-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LEBERCUT"><link rel="stylesheet" href="assets/workbench.css?v=prism04"><link rel="stylesheet" href="assets/carbon-intro.css?v=prism04"><script defer src="assets/carbon-intro.js?v=prism04"></script></head><body data-intro="leber"><header class="top">
<a href="./" class="brand"><img class="bench-emblem" src="assets/logo-dark.png" alt="LEBERCUT"><span>LEBERCUT</span></a>
<input id="project" aria-label="Nazwa projektu" placeholder="Nazwa projektu"><span id="saved"></span>
<div class="actions"><button id="theme" aria-label="Zmień motyw">◐</button><button id="new">Nowy projekt</button><button id="export">Eksport</button><label class="button">Import<input id="import" type="file" accept=".json,application/json" hidden></label></div></header>
<nav class="modebar"><button id="nav-layout" class="nav active">Rozkrój płyt</button><button id="nav-equal" class="nav">Równe kawałki</button><a href="/">← NOBODY</a></nav>
<main><section id="layout"><div id="tabs" class="tabs"></div><div class="workgrid"><section class="panel entry">
<div class="sectionhead"><h1>Formatki</h1><button id="add-row">+ Dodaj formatkę</button></div>
<div class="table-scroll"><table class="entry-table"><thead><tr><th>Element</th><th>Dł. [mm]</th><th>Szer. [mm]</th><th>Szt.</th><th>Okleina</th><th aria-label="Akcje"></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="row-tools"><span id="count"></span><button id="undo">Cofnij</button><button id="redo">Ponów</button></div>
<details class="batch"><summary>Dodaj wiele formatek</summary><div class="command-bar"><textarea id="command-parts" aria-label="Formatki" placeholder="1500x300x2 1D2K"></textarea><button id="command-add">Dodaj z listy</button><small id="command-error" role="status"></small></div></details>
</section><aside class="panel"><div id="settings"></div><button class="primary reveal" id="reveal">Pokaż rozkrój</button></aside></div>
<section hidden id="results" class="panel result"><div class="sectionhead"><h2>Rozkrój</h2><div><button id="fullscreen">Pełny ekran</button></div></div><label class="cut-toggle"><input type="checkbox" id="show-cuts"> Pokaż kolejność cięć</label><div id="stats" class="stats"></div><div id="warning" role="status"></div><div id="boards"></div><div class="legend"><span><i class="swatch part"></i> Formatka</span><span><i class="swatch waste"></i> Odpad</span></div><div id="totals" class="totals"></div><button id="print" class="primary" hidden>Drukuj całe zamówienie</button></section></section><section id="equal" hidden><div class="panel equal"><h1>Cięcie na równe kawałki</h1><div class="fields"><label>Długość materiału (mm)<input type="number" id="eq-l" value="2500" min="1"></label><label>Liczba kawałków<input type="number" id="eq-n" value="5" min="1"></label><label>Rzaz (mm)<input type="number" id="eq-k" value="3.2" min="0" step="0.1"></label></div><div id="eq-result"></div><button id="print-equal">Drukuj wynik</button></div></section></main><div id="print-area"></div><script type="module" src="assets/app.js?v=metal-wholeorder2"></script></body></html>

<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2f5f9"><title>LEBERCUT — rozkrój płyt</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="top"><a href="./" class="brand"><img src="assets/logo.png" alt="LEBERCUT"></a><nav><button id="nav-layout" class="nav active">Rozkrój płyt</button><button id="nav-equal" class="nav">Równe kawałki</button></nav><div class="actions"><button id="new">Nowy projekt</button><button id="export">Eksport</button><label class="button">Import<input id="import" type="file" accept=".json,application/json" hidden></label><button class="primary" id="print">Drukuj</button></div></header><main><section id="layout"><div class="project"><input id="project" aria-label="Nazwa projektu" placeholder="Nazwa zamówienia (opcjonalnie)"><span id="saved">Zapis lokalny</span></div><div id="tabs" class="tabs"></div><div class="workspace"><section class="panel entry"><div id="settings"></div><div class="sectionhead"><h2>Formatki</h2><span id="count"></span></div><div class="table-scroll"><table class="parts"><thead><tr><th>#</th><th>Długość <small>mm</small></th><th>Szerokość <small>mm</small></th><th>Ilość</th><th id="edgeheading">Okleina</th><th id="grainheading">Słoje</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><button id="add" class="add">+ Dodaj formatkę</button><p class="hint">Enter — kolejna formatka · strzałka pod polem — kopiuj wymiar z poprzedniego wiersza</p></section><section class="panel result"><div class="sectionhead"><h2>Plan rozkroju</h2><button id="fullscreen">Pełny ekran</button></div><div id="stats" class="stats"></div><div id="warning" role="status"></div><div id="boards"></div><div class="legend"><span><i class="swatch part"></i> Formatka</span><span><i class="swatch waste"></i> Odpad</span></div></section></div><div id="totals" class="totals"></div></section><section id="equal" hidden><div class="panel equal"><h1>Cięcie na równe kawałki</h1><div class="fields"><label>Długość materiału (mm)<input type="number" id="eq-l" value="2500" min="1"></label><label>Liczba kawałków<input type="number" id="eq-n" value="5" min="1"></label><label>Rzaz (mm)<input type="number" id="eq-k" value="3.2" min="0" step="0.1"></label></div><div id="eq-result"></div></div></section></main><dialog id="print-dialog"><h2>Wydruk A4</h2><p>Wybierz zawartość dokumentu.</p><label><input type="checkbox" id="p-scheme" checked> Schemat rozkroju</label><label><input type="checkbox" id="p-list" checked> Zestawienie tekstowe</label><div class="actions"><button id="p-cancel">Anuluj</button><button id="p-go" class="primary">Drukuj / PDF</button></div></dialog><div id="print-area"></div><script type="module" src="assets/app.js"></script></body></html>
